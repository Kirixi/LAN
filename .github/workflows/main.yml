name: CI/CD Pipeline
on:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GHCR
        run: |
          docker login --username Kirixi --password ${{ secrets.GHRC_TOKEN }} ghcr.io

      - name: Build backend image
        run: |
          docker build . --tag ghcr.io/kirixi/lanserver-stable:${GITHUB_SHA::7}
        working-directory: ./Backend
      - name: Build frontend image
        run: |
          docker build . --tag ghcr.io/kirixi/lanfrontend-stable:${GITHUB_SHA::7}
        working-directory: ./Frontend
      - name: Push the images into GHCR
        run: |
          docker push ghcr.io/kirixi/lanfrontend-stable:${GITHUB_SHA::7}
          docker push ghcr.io/kirixi/lanserver-stable:${GITHUB_SHA::7}

  deploy-eks:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GHCR
        run: |
          docker login --username Kirixi --password ${{ secrets.GHRC_TOKEN }} ghcr.io

