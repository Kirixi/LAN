name: CI/CD Pipeline
on:
  push:
    branches:
      - main
      - develop
      - feat-eks

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set image tag
        id: export-tag
        run: echo "::set-output name=image_tag::${GITHUB_SHA::7}"

      - name: Login to GHCR
        run: |
          docker login --username Kirixi --password ${{ secrets.GHRC_TOKEN }} ghcr.io

      - name: Build backend image
        run: |
          docker build . --tag ghcr.io/kirixi/lanserver-stable:${{ steps.export-tag.outputs.image_tag }}
        working-directory: ./Backend
      - name: Build frontend image
        run: |
          docker build . --tag ghcr.io/kirixi/lanfrontend-stable:${{ steps.export-tag.outputs.image_tag }}
        working-directory: ./Frontend
      - name: Push the images into GHCR
        run: |
          docker push ghcr.io/kirixi/lanfrontend-stable:${{ steps.export-tag.outputs.image_tag }}
          docker push ghcr.io/kirixi/lanserver-stable:${{ steps.export-tag.outputs.image_tag }}

  deploy-eks:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GHCR
        run: |
          docker login --username Kirixi --password ${{ secrets.GHRC_TOKEN }} ghcr.io

      - name: Login to AWS
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-region: ${{ secrets.REGION }}
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_KEY }}

      - name: Get kube config file
        run: aws eks update-kubeconfig --region ${{ secrets.REGION }} --name ${{ secrets.EKS_NAME }}

      - name: Deploy with Helm
        uses: bitovi/github-actions-deploy-eks-helm@v1.2.10
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_KEY }}
          aws-region: ${{secrets.REGION }}
          cluster-name: ${{ secrets.EKS_NAME }}
          chart-path: k8s/helmcharts
          namespace: default
          values: imagetag=${{ needs.build-and-push.outputs.image_tag }}
          name: lan-helm
